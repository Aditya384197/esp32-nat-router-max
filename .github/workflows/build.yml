name: Build ESP32 Router Firmware

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: ESP32 NAT Router Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF v5.1.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.2
          target: esp32
          path: .
          command: |
            idf.py set-target esp32
            idf.py build

      - name: Show build files
        run: |
          echo "===== BUILD FILES ====="

          find build -maxdepth 3 -type f \
            \( \
              -name "*.bin" \
              -o -name "sdkconfig" \
              -o -name "flasher_args.json" \
            \) \
            -print

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-router-firmware

          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json
            build/sdkconfig

          retention-days: 30
